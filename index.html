<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#02040a" />
    <meta
      name="description"
      content="月面を駆け、跳び、光線銃で進む横スクロールアクション"
    />
    <title>Cosmic Runner</title>
    <style>
      :root {
        color-scheme: dark;
        --cyan: #8de9ff;
        --panel: rgba(7, 18, 37, 0.84);
        --line: rgba(96, 220, 255, 0.62);
        --famicom-red: #a51f35;
        --famicom-dark: #17181b;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: #02040a;
        position: fixed;
        inset: 0;
      }

      body::after {
        position: fixed;
        inset: 0;
        z-index: 30;
        pointer-events: none;
        content: "";
        background: repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.018) 0,
          rgba(255, 255, 255, 0.018) 1px,
          transparent 1px,
          transparent 4px
        );
        mix-blend-mode: screen;
      }

      #game-container {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
      }

      #game-container canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        object-fit: contain;
      }

      #virtual-controls {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 20;
        display: flex;
        height: clamp(156px, 25vh, 190px);
        align-items: center;
        justify-content: space-between;
        padding: 10px max(12px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
        border-top: 1px solid rgba(96, 220, 255, 0.3);
        background: linear-gradient(180deg, rgba(3, 9, 22, 0.08), rgba(2, 8, 21, 0.76));
        pointer-events: none;
      }

      #virtual-controls button {
        -webkit-appearance: none;
        appearance: none;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        background: var(--panel);
        box-shadow:
          inset 0 0 18px rgba(73, 190, 255, 0.1),
          0 8px 28px rgba(0, 0, 0, 0.3);
        color: var(--famicom-dark);
        font: 700 20px/1 ui-monospace, "SFMono-Regular", monospace;
        pointer-events: auto;
        outline: none;
        -webkit-user-select: none;
        user-select: none;
        cursor: pointer;
        transition:
          transform 38ms cubic-bezier(0.2, 0.8, 0.2, 1),
          box-shadow 38ms linear,
          background-color 38ms linear;
      }

      #virtual-controls button small {
        display: block;
        margin-top: 4px;
        font-size: 8px;
        font-weight: 500;
        letter-spacing: 0.08em;
        opacity: 0.78;
      }

      #virtual-controls button:active,
      #virtual-controls button.is-pressed {
        background: #f1ead8;
        box-shadow: 0 0 24px rgba(255, 231, 170, 0.3);
        transform: scale(0.94);
      }

      #virtual-controls button:focus,
      #virtual-controls button:focus-visible {
        outline: none;
      }

      .dpad {
        display: grid;
        grid-template: repeat(3, 58px) / repeat(3, 58px);
        gap: 0;
        flex: 0 0 auto;
        padding: 6px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background:
          linear-gradient(145deg, rgba(16, 38, 67, 0.92), rgba(4, 13, 29, 0.94));
        box-shadow:
          inset 0 0 18px rgba(62, 199, 255, 0.08),
          0 7px 22px rgba(0, 0, 0, 0.44),
          0 0 12px rgba(63, 207, 255, 0.08);
      }

      .dpad button {
        width: 58px;
        height: 58px;
        border: 0;
        border-radius: 5px;
        background: var(--famicom-dark);
        color: #ddd8cc;
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.06);
      }

      .dpad button:active,
      .dpad button.is-pressed {
        background: #34363b;
        box-shadow:
          inset 0 4px 7px #050505,
          inset 0 0 0 1px rgba(255, 255, 255, 0.04);
        transform: translateY(3px) scale(0.97);
      }

      #cv-up { grid-area: 1 / 2; }
      #cv-left { grid-area: 2 / 1; }
      #cv-right { grid-area: 2 / 3; }
      #cv-down { grid-area: 3 / 2; }

      .dpad-center {
        grid-area: 2 / 2;
        background:
          radial-gradient(circle, #2e3034 0 18%, transparent 20%),
          var(--famicom-dark);
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.04);
      }

      .action-btns {
        display: flex;
        flex: 0 0 auto;
        gap: 10px;
        align-items: center;
        padding: 14px 12px;
        border: 1px solid var(--line);
        border-radius: 42px 14px 42px 14px;
        background:
          linear-gradient(145deg, rgba(16, 38, 67, 0.92), rgba(4, 13, 29, 0.94));
        box-shadow:
          inset 0 0 18px rgba(62, 199, 255, 0.08),
          0 7px 22px rgba(0, 0, 0, 0.44),
          0 0 12px rgba(63, 207, 255, 0.08);
      }

      .action-btns button {
        width: 58px;
        height: 58px;
        border: 4px solid rgba(91, 13, 30, 0.68);
        border-radius: 50%;
        background: var(--famicom-red);
        color: #fff3e4;
        box-shadow:
          inset 0 5px 7px rgba(255, 255, 255, 0.18),
          0 5px 0 #641122;
      }

      .action-btns button:active,
      .action-btns button.is-pressed {
        background: #c12b45;
        box-shadow: inset 0 3px 7px rgba(50, 0, 10, 0.5);
        transform: translateY(4px);
      }

      .system-buttons {
        position: absolute;
        bottom: calc(18px + env(safe-area-inset-bottom));
        left: 50%;
        display: flex;
        gap: 12px;
        transform: translateX(-50%);
        color: rgba(237, 224, 205, 0.72);
        font: 700 8px/1 ui-monospace, "SFMono-Regular", monospace;
        letter-spacing: 0.1em;
        text-align: center;
      }

      .system-buttons span::before {
        display: block;
        width: 42px;
        height: 12px;
        margin-bottom: 5px;
        border: 2px solid rgba(96, 220, 255, 0.46);
        border-radius: 8px;
        background: #222328;
        content: "";
      }

      @media (min-width: 900px) and (pointer: fine) {
        #virtual-controls {
          display: none;
        }
      }

      @media (max-width: 699px) {
        .system-buttons {
          display: none;
        }
      }

      @media (max-height: 420px) {
        #virtual-controls {
          height: 126px;
          padding-top: 6px;
          padding-bottom: calc(6px + env(safe-area-inset-bottom));
        }

        /* 操作性優先：横画面でも十字キーとA/Bは58pxを維持し、上側へ重ねる。 */
      }
    </style>
    <script type="module" crossorigin src="./assets/game.js"></script>
  </head>
  <body>
    <main id="game-container" aria-label="Cosmic Runner game"></main>
    <nav id="virtual-controls" aria-label="ゲーム操作">
      <div class="dpad">
        <button type="button" id="cv-up" aria-label="ジャンプ">↑<small>JUMP</small></button>
        <button type="button" id="cv-left" aria-label="左へ移動">←</button>
        <span class="dpad-center" aria-hidden="true"></span>
        <button type="button" id="cv-right" aria-label="右へ移動">→</button>
        <button type="button" id="cv-down" aria-label="しゃがむ">↓<small>CROUCH</small></button>
      </div>
      <div class="system-buttons" aria-hidden="true"><span>SELECT</span><span>START</span></div>
      <div class="action-btns">
        <button type="button" id="cv-b" aria-label="ジャンプ">B<small>JUMP</small></button>
        <button type="button" id="cv-a" aria-label="射撃">A<small>BLASTER</small></button>
      </div>
    </nav>
  </body>
</html>
